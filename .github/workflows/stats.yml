name: Update stats
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/stats.mjs && mkdir out && mv assets/dark/stats.svg out/stats-dark.svg && mv assets/light/stats.svg out/stats-light.svg
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
      # Publish to an orphan `output` branch rebuilt from scratch each run: the SVG never has more than one commit of history.
      - working-directory: out
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats-dark.svg stats-light.svg
          git commit -qm "Update stats"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" output
